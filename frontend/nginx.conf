server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression : le bundle React dépasse 400 Ko, la différence est nette.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Les ressources produites par Vite portent une empreinte dans leur nom :
    # elles peuvent être mises en cache indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Les en-têtes de sécurité sont répétés dans chaque bloc `location` :
        # nginx n'hérite des `add_header` du bloc parent QUE si le bloc courant
        # n'en définit aucun. Un seul `add_header` ici écraserait silencieusement
        # toute la liste définie au niveau `server`.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Application monopage : toute route est rendue par index.html, que le
    # routeur React résout ensuite côté navigateur.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html ne doit jamais être mis en cache, sous peine de servir un
        # bundle périmé après un déploiement.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
